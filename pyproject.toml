[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bilbyflow"
version = "1.1.0"
authors = [
  { name = "Liam Pinchbeck", email = "lcpinchbeck@gmail.com" },
]
description = "A fast and efficient package built with Bilby design principles for gravitational wave neural posterior estimation"
readme = "README.md"
requires-python = ">=3.10" # currently testing to see if this can be loosened
license = "MIT"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "torchvision>=0.15",
    "sbi>=0.22",
    "zuko>=1.0",
    "bilby>=2.1",
    "matplotlib>=3.7",
    "corner>=2.2",
    "arviz>=0.15",
    "pyyaml>=6.0",
    "tqdm",
]

[project.optional-dependencies]
pesummary = ["pesummary>=0.13"]
dev = ["pytest", "ruff"]
test = ["pytest>=7", "zuko>=1.0"]
download = ["gwpy>=3.0", "gwosc>=0.7"]

[project.scripts]
bilbyflow-train = "bilbyflow.scripts.train:main"
bilbyflow-reweight-real = "bilbyflow.scripts.reweight_real:main"
bilbyflow-reweight-injections = "bilbyflow.scripts.reweight_injections:main"
bilbyflow-download-noise = "bilbyflow.scripts.download_noise:main"
bilbyflow-init = "bilbyflow.scripts.init_scripts:main"


[project.urls]
Homepage = "https://github.com/LiamCPinchbeck/BilbyFlow"
Issues = "https://github.com/LiamCPinchbeck/BilbyFlow/issues"

[tool.setuptools.packages.find]
where = ["src"]


#[project.entry-points."bilby.samplers"]
#bilbyflow = "bilbyflow.plugin:BilbyFlow"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end runs (minutes, not seconds)"]
addopts = "-q -m 'not slow'"
