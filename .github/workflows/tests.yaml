name: tests

on:
  push:
    branches: [main]        # a commit lands on main (incl. a merge)
  pull_request:
    branches: [main]        # a PR TARGETING main, run on the PR's code
  workflow_dispatch:        # manual "Run workflow" button

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU torch — the runners have no GPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"

      - name: Import check
        run: |
          python - <<'PY'
          import importlib
          mods = ["bilbyflow", "bilbyflow.io", "bilbyflow.coordinates",
                  "bilbyflow.data", "bilbyflow.nn", "bilbyflow.likelihood",
                  "bilbyflow.inference", "bilbyflow.diagnostics",
                  "bilbyflow.training", "bilbyflow.plotting",
                  "bilbyflow.scripts"]
          bad = []
          for m in mods:
              try:
                  importlib.import_module(m)
                  print("ok  ", m)
              except Exception as e:
                  print("FAIL", m, type(e).__name__, e)
                  bad.append(m)
          raise SystemExit(1 if bad else 0)
          PY

      - name: Byte-level file check
        run: |
          python - <<'PY'
          # NUL bytes in a source file break imports with an error that names
          # no line number — this cost real debugging time once.
          import pathlib, sys
          bad = [p for p in pathlib.Path("src").rglob("*.py")
                 if b"\x00" in p.read_bytes()]
          for p in bad:
              print("NUL bytes in", p)
          sys.exit(1 if bad else 0)
          PY

      - name: Console scripts resolve
        run: |
          # made this get the cli scripts from the installed metadata, can't
          # bug out from [project.scripts] as entry points are added.
          python - <<'PY' > /tmp/scripts.txt
          from importlib.metadata import distribution
          for ep in distribution("bilbyflow").entry_points:
              if ep.group == "console_scripts":
                  print(ep.name)
          PY
          while read -r c; do echo "--- $c"; "$c" --help > /dev/null; done \
              < /tmp/scripts.txt

      - name: pytest
        run: pytest tests -v --durations=10